name: Verificacion DLP
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows-static:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 syntax only
        shell: powershell
        run: ./scripts/check-powershell.ps1
      - name: PowerShell 5.1 atomic state regression, no system policies
        shell: powershell
        run: ./evaluacion/test-windows-state.ps1
      - name: Register and remove a task with a fake client, no sensors
        shell: powershell
        run: ./evaluacion/test-windows-task.ps1
  functional:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: npm test
      - run: npm run browser:install -- --with-deps
      - run: npm run extension:build
      - run: npm run test:browser
      - run: npm run test:central
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r integrations/requirements.txt
      - run: .venv/bin/python -m unittest discover -s test -p 'test_*.py'
      - run: npm run test:managed
        env:
          DLP_PYTHON: .venv/bin/python
      - name: PC filter with synthetic explicit-proxy traffic, no native capture
        run: npm run test:pc-filter
        env:
          DLP_PYTHON: .venv/bin/python
      - run: node evaluacion/strict-e2e.js
        env:
          DLP_PYTHON: .venv/bin/python
      - name: Real nftables in isolated namespaces only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nftables iproute2
          sudo python3 evaluacion/test-strict-nft.py
