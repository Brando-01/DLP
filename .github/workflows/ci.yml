name: Verificacion DLP
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows-static:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 syntax only
        shell: powershell
        run: ./scripts/check-powershell.ps1
  functional:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: npm test
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r integrations/requirements.txt
      - run: .venv/bin/python -m unittest discover -s test -p 'test_*.py'
      - run: npm run test:managed
        env:
          DLP_PYTHON: .venv/bin/python
