<ossec_config>
  <global><jsonout_output>yes</jsonout_output><alerts_log>yes</alerts_log><logall>no</logall><logall_json>no</logall_json></global>
  <alerts><log_alert_level>3</log_alert_level><email_alert_level>12</email_alert_level></alerts>
  <remote><connection>secure</connection><port>1514</port><protocol>tcp</protocol><queue_size>131072</queue_size></remote>
  <auth><disabled>no</disabled><port>1515</port><use_source_ip>no</use_source_ip><purge>yes</purge><use_password>yes</use_password><ssl_verify_host>no</ssl_verify_host><ssl_manager_cert>etc/sslmanager.cert</ssl_manager_cert><ssl_manager_key>etc/sslmanager.key</ssl_manager_key><ssl_auto_negotiate>no</ssl_auto_negotiate></auth>
  <ruleset><decoder_dir>ruleset/decoders</decoder_dir><rule_dir>ruleset/rules</rule_dir><decoder_dir>etc/decoders</decoder_dir><rule_dir>etc/rules</rule_dir><list>etc/lists/audit-keys</list><list>etc/lists/security-eventchannel</list><list>etc/lists/amazon/aws-eventnames</list><list>etc/lists/malicious-ioc/malware-hashes</list><list>etc/lists/malicious-ioc/malicious-ip</list><list>etc/lists/malicious-ioc/malicious-domains</list></ruleset>
  <localfile><location>/var/log/dlp/siem.jsonl</location><log_format>json</log_format></localfile>
  <localfile><location>/var/log/dlp-sensors/dns.jsonl</location><log_format>json</log_format></localfile>
  <localfile><location>/var/log/dlp-sensors/proxy.jsonl</location><log_format>json</log_format></localfile>
  <localfile><location>/var/log/dlp-sensors/mail.jsonl</location><log_format>json</log_format></localfile>
  <localfile><location>/var/log/dlp-sensors/suricata/eve.json</location><log_format>json</log_format></localfile>
  <localfile><location>/var/log/dlp-sensors/samba/audit.log</location><log_format>syslog</log_format></localfile>
  <localfile><location>/var/log/dlp-sensors/dnsmasq.log</location><log_format>syslog</log_format></localfile>
  <syscheck><disabled>yes</disabled></syscheck>
  <rootcheck><disabled>yes</disabled></rootcheck>
  <sca><enabled>no</enabled></sca>
  <cluster><disabled>yes</disabled></cluster>
</ossec_config>
