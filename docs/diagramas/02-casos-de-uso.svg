<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="990" viewBox="0 0 1440 990" role="img" aria-labelledby="title desc">
<title id="title">Casos de uso y actores</title><desc id="desc">Las funciones web y las tareas técnicas locales se muestran en límites separados.</desc>
