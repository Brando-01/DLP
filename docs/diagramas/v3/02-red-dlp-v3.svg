<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="2260" viewBox="0 0 2600 2260" role="img"><title>Arquitectura de red del proyecto</title><desc>Despliegue del laboratorio: Windows + WSL2 / Docker; separación de datos, control y observación.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#162d43"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53697b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f83"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2864ad"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#986208"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ae3550"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#167958"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#cbd8e3"/></marker><marker id="bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f4f7fa"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffffff"/></marker></defs><style>text{font-family:'Segoe UI',Arial,sans-serif}</style>
<rect x="0" y="0" width="2600" height="2260" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="64" y="53" font-size="23" fill="#087f83" font-weight="700">DLP ADMINISTRADO  /  FIGURA 02</text>
<text x="64" y="112" font-size="47" fill="#162d43" font-weight="700">Arquitectura de red del proyecto</text>
<text x="64" y="159" font-size="25" fill="#53697b" font-weight="400">Despliegue del laboratorio: Windows + WSL2 / Docker; separación de datos, control y observación.</text>
<path d="M64 191H2536" fill="none" stroke="#cbd8e3" stroke-width="3" stroke-linejoin="round"/>
<rect x="64" y="339" width="2472" height="1528" rx="22" fill="#f4f7fa" stroke="#cbd8e3" stroke-width="2"/>
<text x="89" y="323" font-size="26" fill="#162d43" font-weight="700">EQUIPO FÍSICO DEL LABORATORIO</text>
<rect x="89" y="359" width="565" height="1440" rx="16" fill="#ffffff" stroke="#2864ad" stroke-width="2"/>
<text x="114" y="404" font-size="26" fill="#2864ad" font-weight="700">WINDOWS · EQUIPO PROTEGIDO</text>
<rect x="114" y="455" width="515" height="216" rx="16" fill="#ffffff" stroke="#2864ad" stroke-width="2"/>
<text x="138" y="493" font-size="27" fill="#2864ad" font-weight="700">Navegador y aplicaciones</text>
<text x="138" y="532" font-size="24" fill="#53697b" font-weight="400">Chrome / Edge o Firefox.</text>
<text x="138" y="565" font-size="24" fill="#53697b" font-weight="400">Extensión → agente local.</text>
<text x="138" y="598" font-size="24" fill="#53697b" font-weight="400">Token del navegador (no Groq).</text>
<text x="138" y="631" font-size="24" fill="#53697b" font-weight="400">Navegación: solo origen del sitio.</text>
<rect x="114" y="730" width="515" height="216" rx="16" fill="#ffffff" stroke="#087f83" stroke-width="2"/>
<text x="138" y="768" font-size="27" fill="#087f83" font-weight="700">Agente local · Node.js</text>
<text x="138" y="807" font-size="24" fill="#53697b" font-weight="400">127.0.0.1:3001 · panel endpoint.</text>
<text x="138" y="840" font-size="24" fill="#53697b" font-weight="400">Carpetas, copias mediadas, eventos.</text>
<text x="138" y="873" font-size="24" fill="#53697b" font-weight="400">Actividad en vivo y recibos.</text>
<text x="138" y="906" font-size="24" fill="#53697b" font-weight="400">Credencial de extensión separada.</text>
<path d="M371 671V730" fill="none" stroke="#2864ad" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="392" y="709" font-size="22" fill="#087f83" font-weight="600">loopback</text>
<rect x="114" y="1006" width="515" height="216" rx="16" fill="#ffffff" stroke="#2864ad" stroke-width="2"/>
<text x="138" y="1044" font-size="27" fill="#2864ad" font-weight="700">Sensores del equipo</text>
<text x="138" y="1083" font-size="24" fill="#53697b" font-weight="400">PowerShell: procesos observados.</text>
<text x="138" y="1116" font-size="24" fill="#53697b" font-weight="400">Portapapeles / impresión: cobertura</text>
<text x="138" y="1149" font-size="24" fill="#53697b" font-weight="400">según configuración y permisos.</text>
<text x="138" y="1182" font-size="24" fill="#53697b" font-weight="400">Sysmon + Wazuh: opcionales.</text>
<path d="M371 1006V946" fill="none" stroke="#2864ad" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#blue)"/>
<rect x="114" y="1282" width="515" height="249" rx="16" fill="#ffffff" stroke="#986208" stroke-width="2"/>
<text x="138" y="1320" font-size="27" fill="#986208" font-weight="700">Salida administrada</text>
<text x="138" y="1359" font-size="24" fill="#53697b" font-weight="400">Proxy HTTPS + CA confiable.</text>
<text x="138" y="1392" font-size="24" fill="#53697b" font-weight="400">Firewall limita salida directa.</text>
<text x="138" y="1425" font-size="24" fill="#53697b" font-weight="400">SMTP y DNS autorizados.</text>
<text x="138" y="1458" font-size="24" fill="#53697b" font-weight="400"></text>
<text x="138" y="1491" font-size="24" fill="#53697b" font-weight="400">En el anfitrión: aplicar políticas</text>
<text x="138" y="1524" font-size="24" fill="#53697b" font-weight="400">solo tras revisar el plan.</text>
<rect x="114" y="1593" width="515" height="156" rx="16" fill="#fff9ed" stroke="#dec98c" stroke-width="2"/>
<text x="138" y="1630" font-size="23" fill="#986208" font-weight="400">USB nativo: política del canal.</text>
<text x="138" y="1662" font-size="23" fill="#986208" font-weight="400">Copia nativa: alerta posterior.</text>
<text x="138" y="1694" font-size="23" fill="#986208" font-weight="400">No hay driver universal de archivos.</text>
<text x="138" y="1726" font-size="23" fill="#986208" font-weight="400">USB físico: prueba pendiente.</text>
<rect x="710" y="359" width="1798" height="1440" rx="16" fill="#fbfdfd" stroke="#087f83" stroke-width="2"/>
<text x="737" y="404" font-size="28" fill="#087f83" font-weight="700">DLP-Control-WSL · WSL2 / LINUX / DOCKER</text>
<text x="737" y="440" font-size="24" fill="#53697b" font-weight="400">Red interna Docker: 172.30.50.0/24 · red de administración adicional · salida externa selectiva</text>
<rect x="737" y="478" width="1742" height="191" rx="16" fill="#eaf5f4" stroke="#087f83" stroke-width="2"/>
<text x="763" y="517" font-size="28" fill="#087f83" font-weight="700">CONTROL CENTRAL  ·  172.30.50.10:3100</text>
<text x="763" y="557" font-size="24" fill="#53697b" font-weight="400">Consola / políticas → firma real y extracción → reglas → Groq cuando corresponde → decisión y ticket.</text>
<text x="763" y="592" font-size="24" fill="#53697b" font-weight="400">Roles separados: ADMIN / INSPECT / TELEMETRY. Auditoría encadenada y recibos de ejecución.</text>
<text x="763" y="627" font-size="24" fill="#53697b" font-weight="400">La clave Groq permanece en el servidor; no se coloca en la extensión del navegador.</text>
<path d="M629 811H685V572H737" fill="none" stroke="#087f83" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="659" y="703" font-size="22" fill="#087f83" font-weight="600">API</text>
<rect x="737" y="741" width="554" height="194" rx="16" fill="#ffffff" stroke="#087f83" stroke-width="2"/>
<text x="761" y="779" font-size="27" fill="#087f83" font-weight="700">HTTPS · mitmproxy</text>
<text x="761" y="818" font-size="24" fill="#53697b" font-weight="400">172.30.50.11:8080</text>
<text x="761" y="851" font-size="24" fill="#53697b" font-weight="400">Retiene carga y consulta al motor.</text>
<text x="761" y="884" font-size="24" fill="#53697b" font-weight="400">CU-05 / 06 / 07 · CA requerida.</text>
<text x="761" y="917" font-size="24" fill="#53697b" font-weight="400">No reenvía lo denegado.</text>
<rect x="1331" y="741" width="554" height="194" rx="16" fill="#ffffff" stroke="#087f83" stroke-width="2"/>
<text x="1355" y="779" font-size="27" fill="#087f83" font-weight="700">SMTP · Postfix + filtro MIME</text>
<text x="1355" y="818" font-size="24" fill="#53697b" font-weight="400">Postfix 172.30.50.12:25</text>
<text x="1355" y="851" font-size="24" fill="#53697b" font-weight="400">Filtro 172.30.50.13:2525</text>
<text x="1355" y="884" font-size="24" fill="#53697b" font-weight="400">CU-03 / 04 · inspección antes</text>
<text x="1355" y="917" font-size="24" fill="#53697b" font-weight="400">del relevo al receptor.</text>
<rect x="1925" y="741" width="554" height="194" rx="16" fill="#ffffff" stroke="#2864ad" stroke-width="2"/>
<text x="1949" y="779" font-size="27" fill="#2864ad" font-weight="700">DNS guard + dnsmasq</text>
<text x="1949" y="818" font-size="24" fill="#53697b" font-weight="400">Guard 172.30.50.53:53/UDP</text>
<text x="1949" y="851" font-size="24" fill="#53697b" font-weight="400">dnsmasq 172.30.50.54:5353</text>
<text x="1949" y="884" font-size="24" fill="#53697b" font-weight="400">CU-10 · dominios, tipos, tamaño</text>
<text x="1949" y="917" font-size="24" fill="#53697b" font-weight="400">y frecuencia de consultas.</text>
<path d="M1240 741V669" fill="none" stroke="#087f83" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M1845 741V669" fill="none" stroke="#087f83" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M629 1370H682V838H737" fill="none" stroke="#2864ad" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="743" y="712" font-size="22" fill="#087f83" font-weight="600">HTTPS / SMTP: consulta al motor</text>
<text x="1945" y="712" font-size="22" fill="#087f83" font-weight="600">DNS: política del canal</text>
<rect x="737" y="1007" width="554" height="167" rx="16" fill="#ffffff" stroke="#167958" stroke-width="2"/>
<text x="761" y="1045" font-size="27" fill="#167958" font-weight="700">Receptor de laboratorio</text>
<text x="761" y="1084" font-size="24" fill="#53697b" font-weight="400">172.30.50.20</text>
<text x="761" y="1117" font-size="24" fill="#53697b" font-weight="400">HTTPS / WebDAV :4201</text>
<text x="761" y="1150" font-size="24" fill="#53697b" font-weight="400">SMTP :2526 · recibos y hashes.</text>
<path d="M1014 935V1007" fill="none" stroke="#167958" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="1035" y="978" font-size="22" fill="#087f83" font-weight="600">solo permitido</text>
<path d="M1608 935V978H1306V1090H1291" fill="none" stroke="#167958" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/>
<rect x="1331" y="1007" width="554" height="167" rx="16" fill="#ffffff" stroke="#2864ad" stroke-width="2"/>
<text x="1355" y="1045" font-size="27" fill="#2864ad" font-weight="700">Samba · Finanzas</text>
<text x="1355" y="1084" font-size="24" fill="#53697b" font-weight="400">172.30.50.21:445</text>
<text x="1355" y="1117" font-size="24" fill="#53697b" font-weight="400">CU-02 · registro full_audit.</text>
<text x="1355" y="1150" font-size="24" fill="#53697b" font-weight="400">Acredita lectura, no copia final.</text>
<rect x="1925" y="1007" width="554" height="167" rx="16" fill="#ffffff" stroke="#2864ad" stroke-width="2"/>
<text x="1949" y="1045" font-size="27" fill="#2864ad" font-weight="700">FTP y SSH de prueba</text>
<text x="1949" y="1084" font-size="24" fill="#53697b" font-weight="400">FTP 172.30.50.22:21 · CU-09</text>
<text x="1949" y="1117" font-size="24" fill="#53697b" font-weight="400">SSH 172.30.50.23:22 · CU-08</text>
<text x="1949" y="1150" font-size="24" fill="#53697b" font-weight="400">Cifrados: restricción del canal.</text>
<rect x="737" y="1250" width="554" height="190" rx="16" fill="#ffffff" stroke="#2864ad" stroke-width="2"/>
<text x="761" y="1288" font-size="27" fill="#2864ad" font-weight="700">Cliente aislado de pruebas</text>
<text x="761" y="1327" font-size="24" fill="#53697b" font-weight="400">172.30.50.30 · iptables</text>
<text x="761" y="1360" font-size="24" fill="#53697b" font-weight="400">Solo proxy, SMTP y DNS autorizados.</text>
<text x="761" y="1393" font-size="24" fill="#53697b" font-weight="400">SSH / FTP: excepciones explícitas.</text>
<text x="761" y="1426" font-size="24" fill="#53697b" font-weight="400">Control negativo: probar bypass.</text>
<path d="M1014 1250V1237H725V900H737" fill="none" stroke="#2864ad" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="739" y="1220" font-size="22" fill="#087f83" font-weight="600">Destinos ficticios: evidencia independiente</text>
<rect x="1331" y="1250" width="554" height="190" rx="16" fill="#ffffff" stroke="#986208" stroke-width="2"/>
<text x="1355" y="1288" font-size="27" fill="#986208" font-weight="700">Suricata · IDS pasivo</text>
<text x="1355" y="1327" font-size="24" fill="#53697b" font-weight="400">Observa la interfaz del cliente.</text>
<text x="1355" y="1360" font-size="24" fill="#53697b" font-weight="400">eve.json: firmas sobre FTP / DNS.</text>
<text x="1355" y="1393" font-size="24" fill="#53697b" font-weight="400">Detecta y alerta; no es un IPS.</text>
<text x="1355" y="1426" font-size="24" fill="#53697b" font-weight="400">Comparte la red del cliente.</text>
<path d="M1291 1345H1331" fill="none" stroke="#986208" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/>
<rect x="1925" y="1250" width="554" height="190" rx="16" fill="#ffffff" stroke="#2864ad" stroke-width="2"/>
<text x="1949" y="1288" font-size="27" fill="#2864ad" font-weight="700">Wazuh manager</text>
<text x="1949" y="1327" font-size="24" fill="#53697b" font-weight="400">Correlación de registros y alertas.</text>
<text x="1949" y="1360" font-size="24" fill="#53697b" font-weight="400">Entradas: SIEM, DNS, Samba, IDS.</text>
<text x="1949" y="1393" font-size="24" fill="#53697b" font-weight="400">1514: agentes · 1515: enrolamiento.</text>
<text x="1949" y="1426" font-size="24" fill="#53697b" font-weight="400">Sin dashboard de indexador.</text>
<path d="M1885 1345H1925" fill="none" stroke="#986208" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#amber)"/>
<rect x="737" y="1516" width="1742" height="219" rx="16" fill="#f1f5fa" stroke="#2864ad" stroke-width="2"/>
<text x="763" y="1558" font-size="27" fill="#2864ad" font-weight="700">EVIDENCIA Y RETORNO DE ALERTAS</text>
<text x="763" y="1599" font-size="24" fill="#53697b" font-weight="400">Auditoría completa → siem.jsonl → Wazuh → alerts.json → forwarder → control central.</text>
<text x="763" y="1635" font-size="24" fill="#53697b" font-weight="400">Los conectores confirman liberación, cancelación o fallo; el receptor verifica bytes / hash.</text>
<text x="763" y="1671" font-size="24" fill="#53697b" font-weight="400">Los paneles distinguen: decisión, efecto de la operación, navegación observada y alertas de sensores.</text>
<text x="763" y="1707" font-size="24" fill="#53697b" font-weight="400">CU-01 / 02 se originan en el endpoint; CU-11 / 12 se aplican dentro del motor al contenido recibido.</text>
<path d="M2202 1440V1516" fill="none" stroke="#2864ad" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#blue)"/>
<path d="M1608 1516V1478H708V647H737" fill="none" stroke="#2864ad" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#blue)"/>
<text x="114" y="1838" font-size="24" fill="#53697b" font-weight="400">127.0.0.1 en Windows usa los puertos publicados por WSL; las IP 172.30.50.x pertenecen a los contenedores.</text>
<rect x="1700" y="211" width="808" height="104" rx="16" fill="#ffffff" stroke="#986208" stroke-width="2"/>
<text x="1724" y="249" font-size="27" fill="#986208" font-weight="700">GROQ · SERVICIO EXTERNO</text>
<text x="1724" y="288" font-size="24" fill="#53697b" font-weight="400">HTTPS 443 · texto extraído · API key solo en servidor.</text>
<path d="M2110 478V334H2110V315" fill="none" stroke="#986208" stroke-width="3" stroke-linejoin="round" marker-end="url(#amber)"/>
<text x="2134" y="343" font-size="22" fill="#087f83" font-weight="600">clasificación semántica</text>
<rect x="64" y="1917" width="2472" height="172" rx="16" fill="#ffffff" stroke="#cbd8e3" stroke-width="2"/>
<text x="89" y="1958" font-size="26" fill="#162d43" font-weight="700">ACCESO DESDE WINDOWS</text>
<text x="89" y="1998" font-size="25" fill="#53697b" font-weight="400">3001  agente local   |   3100  control central   |   8080  proxy   |   2525 → 25  SMTP</text>
<text x="89" y="2037" font-size="25" fill="#53697b" font-weight="400">5300/UDP → 53  DNS de prueba   |   1445 → 445  SMB de prueba   |   1514 / 1515  Wazuh</text>
<path d="M64 2146H2536" fill="none" stroke="#cbd8e3" stroke-width="3" stroke-linejoin="round"/>
<text x="64" y="2184" font-size="22" fill="#53697b" font-weight="400">Leyenda: línea continua = solicitud / control; discontinua = observación o retorno de alertas. IP de Wazuh: dinámica.</text>
<text x="64" y="2215" font-size="22" fill="#53697b" font-weight="400">VirtualBox se conserva como alternativa apagada. Kali u otro equipo necesitan una red privada y acceso explícito; localhost es su propio equipo.</text>
</svg>
